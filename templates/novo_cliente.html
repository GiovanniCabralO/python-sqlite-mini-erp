<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Novo Cliente</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; color: #333; }
        .form-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
        h2 { color: #17a2b8; text-align: center; }
        label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; color: #555; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        button { margin-top: 25px; width: 100%; padding: 12px; background-color: #17a2b8; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background-color: #138496; }
        .voltar { display: block; margin-top: 20px; text-align: center; text-decoration: none; color: #007BFF; font-weight: bold; }
        .voltar:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>👤 Cadastrar Cliente</h2>
        
        <form action="/novo_cliente" method="POST">
            
            <label for="nome">Nome Completo:</label>
            <input type="text" name="nome" id="nome" placeholder="Ex: Maria Souza" required>

            <label for="email">E-mail:</label>
            <input type="email" name="email" id="email" placeholder="maria@email.com" required>

            <button type="submit">Salvar Cliente</button>
        </form>
        
        <a href="/" class="voltar">⬅ Voltar ao Dashboard</a>
    </div>
</body>
</html>
